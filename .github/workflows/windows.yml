# Builds the Windows app on a Windows runner (an .exe can't be built on a Mac),
# smoke-tests it headless, and keeps the installer + portable zip as artifacts.
# A v* tag also attaches them to that GitHub Release (next to the Mac DMG).
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # attach files to a release on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        run: packaging/build-win.ps1

      - name: Smoke test
        shell: pwsh
        run: packaging/smoke-win.ps1

      - name: Screenshots
        shell: pwsh
        run: packaging/shots-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: dist/shots/*.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: FlightClock-windows
          path: |
            dist/FlightClock-Setup-*.exe
            dist/FlightClock-*-portable.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlightClock-Setup-*.exe
            dist/FlightClock-*-portable.zip
