<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flight Clock</title>
<link rel="stylesheet" href="/desktop/panel/css/panel.css">
<link rel="stylesheet" href="/desktop/panel/css/cases.css">
</head>
<body data-screen="led" data-case="none" class="bezel">
<div id="case">
  <div class="c-body"></div>
  <div class="c-a"></div><div class="c-b"></div><div class="c-c"></div>
  <div class="c-d"></div><div class="c-e"></div><div class="c-f"></div>
  <div id="well">
    <div id="screen">
      <canvas id="leds"></canvas>
      <canvas id="glow"></canvas>
      <div id="offline">STARTING…</div>
    </div>
    <!-- Now Playing: ⏮ ⏯ ⏭ over the screen, shown on hover while that module is up (core.js) -->
    <div id="np-controls">
      <div id="np-msg"></div>
      <div class="np-bar">
        <button class="np-btn" data-action="previous" title="Previous song">
          <svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button class="np-btn np-main" data-action="playpause" title="Pause">
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
        </button>
        <button class="np-btn" data-action="next" title="Next song">
          <svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<script src="/desktop/panel/js/board.js"></script>
<script src="/desktop/panel/js/world.js"></script>
<script src="/desktop/panel/js/art.js"></script>
<script src="/desktop/panel/js/layouts/ai_usage.js"></script>
<script src="/desktop/panel/js/layouts/ap_news.js"></script>
<script src="/desktop/panel/js/layouts/calendar.js"></script>
<script src="/desktop/panel/js/layouts/clock_weather.js"></script>
<script src="/desktop/panel/js/layouts/event_countdown.js"></script>
<script src="/desktop/panel/js/layouts/flight_tracker.js"></script>
<script src="/desktop/panel/js/layouts/maze.js"></script>
<script src="/desktop/panel/js/layouts/now_playing.js"></script>
<script src="/desktop/panel/js/layouts/snow_report.js"></script>
<script src="/desktop/panel/js/layouts/specific_flight_tracker.js"></script>
<script src="/desktop/panel/js/layouts/sports.js"></script>
<script src="/desktop/panel/js/layouts/stock_ticker.js"></script>
<script src="/desktop/panel/js/layouts/system_stats.js"></script>
<script src="/desktop/panel/js/layouts/transit.js"></script>
<script src="/desktop/panel/js/layouts/world_clock.js"></script>
<script src="/desktop/panel/js/layouts/world_daylight.js"></script>
<script src="/desktop/panel/js/fixtures.js"></script>
<script src="/desktop/panel/js/screens/led.js"></script>
<script src="/desktop/panel/js/screens/flipboard.js"></script>
<script src="/desktop/panel/js/screens/eink.js"></script>
<script src="/desktop/panel/js/core.js"></script>
</body>
</html>
